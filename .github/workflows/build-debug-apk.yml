name: Build Selfhost Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      SELFHOST_PRODUCT_NAME: Readest Selfhost
      SELFHOST_APP_IDENTIFIER: com.readest.selfhost
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - name: Initialize submodules
        run: git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup app vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Patch selfhost app metadata
        working-directory: apps/readest-app
        run: node scripts/patch-tauri-selfhost.mjs

      - name: Re-init Android project for the selfhost package name
        working-directory: apps/readest-app
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init

      - name: Drop optional pen flavors that break Gradle variant matching
        working-directory: apps/readest-app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def remove_block(text, marker):
              start = text.index(marker)
              brace = text.index("{", start)
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[:start] + text[i + 1 :]

          plugin = Path("src-tauri/plugins/tauri-plugin-native-bridge/android/build.gradle.kts")
          text = plugin.read_text()
          text = text.replace('    flavorDimensions += "pen"\n', "")
          text = remove_block(text, 'create("genericPen")')
          text = remove_block(text, 'create("booxPen")')
          text = remove_block(text, '"booxPenImplementation"')
          plugin.write_text(text)

          app = Path("src-tauri/gen/android/app/build.gradle.kts")
          app.write_text(app.read_text().replace('        missingDimensionStrategy("pen", penFlavor)\n', ""))
          PY

      - name: Create a private signing key
        working-directory: apps/readest-app
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/selfhost.jks" \
            -storepass selfhost -keypass selfhost -alias selfhost \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Readest Selfhost"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/selfhost.jks
          storePassword=selfhost
          keyAlias=selfhost
          keyPassword=selfhost
          EOF

      - name: Build debug arm64 APK
        working-directory: apps/readest-app
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export NDK_HOME="$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)"
          echo "Using NDK_HOME=$NDK_HOME"
          pnpm tauri android build -t aarch64 --split-per-abi --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: readest-selfhost-arm64
          path: apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
